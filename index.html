<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Year 11 Computer Science ATAR Coursebook</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Western Australian SCSA Year 11 Computer Science ATAR Curriculum Textbook">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <!-- Docsify Theme Stylesheet -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  
  <style>
    :root {
      --theme-color: #0f172a; /* Slate Dark Primary */
      --accent-color: #1e3a8a; /* Navy Accent */
    }
    
    /* Body & Layout Adjustments */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Left Sidebar Custom Styling */
    .sidebar {
      background-color: #f8fafc !important;
      border-right: 1px solid #e2e8f0;
    }
    .sidebar-nav li a {
      font-size: 14px;
      color: #334155;
    }
    .sidebar-nav li a:hover {
      color: var(--accent-color);
    }
    .sidebar-nav li.active > a {
      border-right: 2px solid var(--accent-color);
      color: var(--accent-color) !important;
      font-weight: 600;
    }

    /* Content Area Styles */
    .markdown-section {
      max-width: 850px !important;
      padding-top: 30px;
    }

    /* Code Syntax Box Custom Colors */
    .markdown-section pre {
      background-color: #0f172a !important; /* Slate Dark */
      border-radius: 8px;
      padding: 18px;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
    }
    .markdown-section code {
      font-family: "Fira Code", "Noto Sans Mono", Monaco, Consolas, monospace !important;
      font-size: 0.9em;
    }

    /* Custom Styling for SCSA Callouts (Alerts) */
    .markdown-section blockquote {
      border-left: 4px solid #f59e0b !important; /* Amber Accent Line */
      background-color: #fffbeb !important; /* Light Gold Tint */
      color: #78350f !important;
      padding: 16px 20px;
      margin: 24px 0;
      border-radius: 4px;
    }
    .markdown-section blockquote p {
      margin: 0;
      font-weight: 500;
    }

    /* Styled Tables */
    .markdown-section table {
      width: 100%;
      display: table;
      border-collapse: collapse;
      margin: 24px 0;
    }}
    .markdown-section th {
      background-color: #1e3a8a !important; /* Navy */
      color: #ffffff !important;
      font-weight: 600;
      border: 1px solid #cbd5e1;
    }
    .markdown-section td {
      border: 1px solid #cbd5e1;
      padding: 10px;
    }
    .markdown-section tr:nth-child(even) {
      background-color: #f1f5f9;
    }
  </style>
</head>
<body>
  <div id="app">Loading your ATAR coursebook...</div>
  <script>
    window.$docsify = {
      name: 'CS ATAR Year 11',
      repo: '',
      loadSidebar: true,
      subMaxLevel: 2,
      autoHeader: true,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search syllabus concepts...',
        noData: 'No matching topics found!',
        depth: 6
      }
    }
  </script>
  <!-- Docsify Core Framework -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <!-- Search Engine Plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <!-- Language Syntaxes for Highlighting -->
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-sql.min.js"></script>
</body>
</html>
